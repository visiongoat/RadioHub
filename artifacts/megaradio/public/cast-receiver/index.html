<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>MegaRadio</title>
  <link rel="stylesheet" href="receiver.css">
  <script defer src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script defer src="receiver-model.js"></script>
  <script defer src="receiver.js"></script>
</head>
<body data-state="idle">
  <!-- CAF owns this single, unmuted media element and all transport controls. -->
  <video class="castMediaElement" playsinline aria-hidden="true"></video>
  <div class="backdrop" aria-hidden="true">
    <img id="backdrop-art" alt="" hidden>
  </div>
  <main class="safe-area">
    <section class="station" aria-label="MegaRadio">
      <div class="artwork">
        <img id="station-art" class="station-art" alt="" hidden>
        <img id="fallback-art" class="fallback-art" src="assets/mega-mark.svg" alt="" width="114" height="110">
      </div>
      <h1 id="station-name">MegaRadio</h1>
      <p id="track-name" class="track" hidden></p>
      <p id="playback-state" class="state" role="status" aria-live="polite"></p>
    </section>
    <img class="signature" src="assets/mega-wordmark.svg" alt="MegaRadio" width="223" height="45">
  </main>
</body>
</html>
