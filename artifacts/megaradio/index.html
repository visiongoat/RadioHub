<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script id="app-load-recovery">
      // Run before the module graph: main.tsx cannot recover if one of its imports fails.
      (function () {
        var retryKey = 'megaradio:asset-recovery';
        var reloading = false;
        function showFailure() {
          if (!document.body) {
            document.addEventListener('DOMContentLoaded', showFailure, { once: true });
            return;
          }
          if (document.getElementById('app-load-error')) return;
          var messages = {
            en: ['The page could not finish loading.', 'Reload'],
            de: ['Die Seite konnte nicht fertig geladen werden.', 'Neu laden'],
            tr: ['Sayfa tamamen yüklenemedi.', 'Yeniden yükle'],
            ar: ['تعذر إكمال تحميل الصفحة.', 'إعادة التحميل'],
            es: ['No se pudo completar la carga de la página.', 'Recargar'],
            fr: ['Le chargement de la page a échoué.', 'Recharger'],
            it: ['Impossibile completare il caricamento della pagina.', 'Ricarica'],
            pt: ['Não foi possível concluir o carregamento da página.', 'Recarregar'],
            ru: ['Не удалось загрузить страницу полностью.', 'Перезагрузить'],
            zh: ['页面未能完成加载。', '重新加载'],
            ja: ['ページの読み込みを完了できませんでした。', '再読み込み'],
            ko: ['페이지를 완전히 불러오지 못했습니다.', '새로고침'],
            hi: ['पेज पूरी तरह लोड नहीं हो सका।', 'फिर से लोड करें'],
            he: ['לא ניתן להשלים את טעינת הדף.', 'טעינה מחדש']
          };
          var language = (document.documentElement.lang || 'en').toLowerCase().split('-')[0];
          var copy = Object.prototype.hasOwnProperty.call(messages, language) ? messages[language] : messages.en;
          var panel = document.createElement('div');
          panel.id = 'app-load-error';
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483000;width:420px;max-width:calc(100% - 32px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;border:1px solid #666;border-radius:8px;background:#171717;color:#fff;font:16px/1.5 system-ui,sans-serif';
          var message = document.createElement('span');
          message.textContent = copy[0];
          message.style.cssText = 'flex:1;min-width:160px;overflow-wrap:anywhere';
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = copy[1];
          button.style.cssText = 'min-height:44px;padding:8px 16px;border:1px solid #f16bb4;border-radius:4px;background:#bc1d79;color:#fff;font:inherit;cursor:pointer';
          button.onclick = function () { window.location.reload(); };
          panel.appendChild(message);
          panel.appendChild(button);
          document.body.appendChild(panel);
        }
        function recover(event) {
          if (reloading) return;
          var entry = document.querySelector('script[type="module"][src]');
          var fingerprint = window.location.pathname + '|' + (entry ? entry.getAttribute('src') : '');
          try {
            // One automatic retry per page/build, including across reloads.
            if (navigator.onLine !== false && window.sessionStorage.getItem(retryKey) !== fingerprint) {
              window.sessionStorage.setItem(retryKey, fingerprint);
              reloading = true;
              event.preventDefault();
              window.location.reload();
              return;
            }
          } catch (_) { /* Storage can be unavailable in restricted browser sessions. */ }
          showFailure();
        }
        window.addEventListener('error', function (event) {
          var script = event.target;
          if (!script || script.tagName !== 'SCRIPT' || script.type !== 'module' || !script.src) return;
          var url = new URL(script.src, window.location.origin);
          if (url.origin === window.location.origin && /^\/assets\/[^?#]+\.m?js$/.test(url.pathname)) recover(event);
        }, true);
        window.addEventListener('vite:preloadError', recover);
      })();
    </script>
    <title>Mega Radio - Listen to Free Live Radio Online</title>
    <meta name="description" content="Listen to live radio online with Mega Radio! 60,000+ AM/FM stations from 120+ countries, music, news, sports, and talk shows for free." />
    
    <!-- SEO: intentionally NO <meta name="robots"> in the static SPA shell.
         Every indexable page gets its robots directives from the SSR head
         (seo-renderer.ts); this shell is only ever served raw on fallback
         paths (timeout/overload/non-eligible routes) which send
         `X-Robots-Tag: noindex` — a baked-in "index, follow" meta here
         contradicted that header on every fallback response. -->

    <meta name="yandex-verification" content="2af3c8203c89a3d9" />
    <meta name="yandex-verification" content="57c83c6ab08ec3ba" />
    <!-- Canonical tag dynamically set by SeoHead component -->
    
    <!-- Favicon and Apple Touch Icons -->
    <link rel="icon" type="image/vnd.microsoft.icon" sizes="64x64" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Mobile and PWA Meta Tags -->
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-title" content="Mega Radio">
    <!-- CRITICAL for Safari iOS background audio: prevent PWA mode -->
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Mega Radio">
    <meta name="msapplication-TileColor" content="#1a1a2e">
    <meta name="msapplication-TileImage" content="/apple-touch-icon.png">
    
    <!-- Core Web Vitals Performance Optimizations - No external font requests -->
    <!-- flagcdn serves country flags in the header/region views — preconnect
         warms TLS+TCP so the flag paints sooner (dns-prefetch alone only resolves DNS). -->
    <!-- NOTE: no `crossorigin` — flags load via plain <img> (no-cors); a
         crossorigin preconnect warms a CORS connection browsers won't reuse
         for no-cors image fetches, wasting the handshake entirely. -->
    <link rel="preconnect" href="https://flagcdn.com">
    <link rel="dns-prefetch" href="https://flagcdn.com">
    <!-- 🚀 PERF: Preconnect to API origin (3-service split) — saves ~300-1000ms TLS+TCP on first API call -->
    <link rel="preconnect" href="https://api.themegaradio.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.themegaradio.com">
    
    <!-- 🚀 Preload critical resources for LCP optimization -->
    <link data-public-preload rel="preload" href="/logo-icon.webp" as="image" type="image/webp" fetchpriority="high">
    <!-- 🚀 CRITICAL: Hero background - aligned with <picture> breakpoint (768px) in radio-frontend.tsx -->
    <link data-public-preload rel="preload" href="/images/hero-bg-430w.webp" as="image" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
    <link data-public-preload rel="preload" href="/images/hero-bg.webp" as="image" type="image/webp" media="(min-width: 768px)" fetchpriority="high">
    
    <!-- Preload the three distinct local Ubuntu files. The existing 600/700
         faces share identical outlines and metrics, and both use the 700 URL. -->
    <link rel="preload" href="/fonts/ubuntu-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- 500 is above-the-fold too: station-card titles render font-medium
         (station-card.tsx), the primary grid on home/genre/region views. -->
    <link rel="preload" href="/fonts/ubuntu-500-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ubuntu-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Critical above-the-fold CSS - INLINED -->
    <style>
      /* Critical CSS for immediate rendering */
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        color: #ffffff;
        line-height: 1.5;
      }
      
      *, *::before, *::after { box-sizing: border-box; }
      
      img {
        height: auto;
        max-width: 100%;
        display: block;
      }
      
      /* CLS OPTIMIZATION: Images with width/height preserve aspect ratio automatically in modern browsers */
      
      /* Optimize above-the-fold images */
      img[data-priority="high"] {
        loading: eager;
      }
      
      .header-critical {
        background-color: #0a0a0a;
        border-bottom: 1px solid #1f1f1f;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      
      .container-critical {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      
      .btn-critical {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.2s;
        border: none;
        cursor: pointer;
      }
      
      .btn-primary-critical {
        background-color: #dc2626;
        color: white;
      }
      
      .btn-primary-critical:hover {
        background-color: #b91c1c;
      }
      
      .below-fold { visibility: hidden; }
      
      .skeleton {
        background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      .search-critical {
        background-color: #1a1a1a;
        border: 1px solid #2a2a2a;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        width: 100%;
        max-width: 400px;
      }
      
      @media (max-width: 768px) {
        .container-critical { padding: 0 0.75rem; }
        .btn-critical { padding: 0.5rem 0.75rem; font-size: 0.875rem; }
      }
    </style>
    
    <!-- Performance monitoring script -->
    <script>
      // Early performance monitoring
      window.performance = window.performance || {};
      window.performance.mark && window.performance.mark('head-end');
    </script>

    <!-- V-A4 FIX (2026-05-08): static Organization + WebSite JSON-LD blocks
         removed. The SSR layer (server/seo-renderer.ts -> generateHtmlHead)
         emits authoritative Organization, WebSite, and page-specific
         schemas dynamically per request/locale with the correct
         hreflang-aware URLs. Keeping static copies here caused duplicate
         schema warnings in Search Console (two Organization entities
         pointing at the same URL) and forced English-only descriptions
         into non-English pages. -->

    <!-- 2026-05-12 perf: Partytown bootstrap. Forwards the well-known
         Clarity queue API to the Web Worker. Google Tag Manager owns its
         dataLayer/gtag queues on the main thread. Partytown must not forward
         those queues to a second runtime. Only Clarity uses
         type="text/partytown"; AdSense + Cast SDK stay on the main
         thread for synchronous DOM access.

         IMPORTANT: Partytown spawns a same-origin sandboxed <iframe> to
         host the Web Worker. Keep it disabled on local development hosts;
         production analytics retain their existing worker setup. -->
    <script data-public-runtime>
      (function () {
        if (/^\/admin(?:\/|$|-login(?:\/|$))/.test(window.location.pathname)) return;
        var host = window.location.hostname || '';
        var isLocal =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '0.0.0.0';
        if (isLocal) return;
        window.partytown = {
          forward: ['clarity']
        };
        var s = document.createElement('script');
        s.src = '/~partytown/partytown.js';
        s.async = true;
        document.head.appendChild(s);
      })();
    </script>

    <!-- Microsoft Clarity tracking code for https://themegaradio.com/
         — runs inside a Partytown Web Worker (type="text/partytown"),
         still deferred to requestIdleCallback to delay the script
         injection until after the main thread is idle. -->
    <script data-public-runtime type="text/partytown">
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "u56nfdsjou");
      }, { timeout: 5000 });
    } else {
      setTimeout(function() {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "u56nfdsjou");
      }, 2000);
    }
    </script>

    <!-- Cast yields to initial rendering. AdSense is initialized once by the
         shared placement runtime after authentication/premium status resolves. -->
    <script>
      (function () {
        function loadDeferredScripts() {
          var cast = document.createElement('script');
          cast.async = true;
          cast.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
          document.head.appendChild(cast);
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadDeferredScripts, { timeout: 4000 });
        } else {
          setTimeout(loadDeferredScripts, 3000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Script to show below-fold content and optimize loading -->
    <script>
      // Performance optimizations
      window.performance.mark && window.performance.mark('body-start');
      
      document.addEventListener('DOMContentLoaded', function() {
        // Show below-fold content after initial render
        setTimeout(function() {
          var belowFoldElements = document.querySelectorAll('.below-fold');
          belowFoldElements.forEach(function(el) {
            el.style.visibility = 'visible';
          });
          
          // Mark critical content as loaded
          window.performance.mark && window.performance.mark('critical-content-loaded');
        }, 100);
        
        // 🚀 PERF (2026-05-12): Preload next page resources on hover —
        // ONLY on devices with a fine pointer (mouse). On mobile/touch
        // devices `mouseover` fires synthetically on tap, which would
        // waste bandwidth and slow the actual click. The previous
        // unconditional `{ once: true }` listener also only prefetched
        // ONE link per page and could fire on a non-navigation element;
        // restricting via media query + early-out keeps desktop wins
        // without mobile cost.
        if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          document.addEventListener('mouseover', function(e) {
            var a = e.target.closest && e.target.closest('a[href]');
            if (!a || !a.href || a.target === '_blank') return;
            // Only prefetch same-origin pages
            try {
              var u = new URL(a.href, location.href);
              if (u.origin !== location.origin) return;
            } catch (_) { return; }
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = a.href;
            document.head.appendChild(link);
          }, { once: true, passive: true });
        }
      });
      
      // Critical Web Vitals measurement
      window.addEventListener('load', function() {
        window.performance.mark && window.performance.mark('page-loaded');
      });
    </script>
  </body>
</html>
